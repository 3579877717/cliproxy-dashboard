<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>静态ISP 节点到期看板</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171e26; --panel2:#1e2731; --line:#26313d;
    --txt:#e6edf3; --dim:#8b98a5; --accent:#4a9eff;
    --ok:#3fb950; --warn:#f0a020; --bad:#f85149;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:radial-gradient(1200px 600px at 15% -10%,#1d2a38 0%,var(--bg) 60%) no-repeat,var(--bg);
    color:var(--txt); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;justify-content:space-between;margin-bottom:22px}
  h1{margin:0;font-size:21px;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:12.5px;margin-top:4px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid}
  .pill.ok{color:var(--ok);border-color:#1f4a2a;background:#12251a}
  .pill.bad{color:var(--bad);border-color:#51201f;background:#2a1414}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .v{font-size:26px;font-weight:680;line-height:1.15;font-variant-numeric:tabular-nums}
  .kpi .k{color:var(--dim);font-size:12px;margin-top:2px}
  .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)}
  h2{font-size:13px;font-weight:650;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-bottom:32px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--ok)}
  .card.warn::before{background:var(--warn)} .card.bad::before{background:var(--bad)}
  .card .ip{font:600 15px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.2px}
  .card .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--dim);margin-left:6px}
  .big{display:flex;align-items:baseline;gap:5px;margin:13px 0 8px}
  .big b{font-size:29px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .big span{color:var(--dim);font-size:12px}
  .bar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-bottom:11px}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
  .card.warn .bar i{background:var(--warn)} .card.bad .bar i{background:var(--bad)}
  .rows{display:flex;flex-direction:column;gap:5px;font-size:12.5px;border-top:1px solid var(--line);padding-top:10px}
  .rows div{display:flex;justify-content:space-between;gap:10px}
  .rows span:first-child{color:var(--dim)}
  .rows span:last-child{font-variant-numeric:tabular-nums;text-align:right}
  .spark{margin-top:10px;display:block;width:100%;height:34px;overflow:visible}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  tbody tr:last-child td{border-bottom:none}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 2px;margin-bottom:24px}
  .empty{color:var(--dim);padding:22px 12px;text-align:center;font-size:13px}
  .err{background:#2a1414;border:1px solid #51201f;color:#ffb4ae;border-radius:10px;padding:12px 14px;margin-bottom:20px;font-size:13px}
  .err code{color:#ffd7d3}
  footer{color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .nowrap{white-space:nowrap}
  /* 解锁界面 */
  #gate{max-width:380px;margin:14vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px}
  #gate h2{text-transform:none;letter-spacing:0;font-size:16px;color:var(--txt);margin:0 0 6px}
  #gate p{color:var(--dim);font-size:12.5px;margin:0 0 18px}
  #gate input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px;outline:none}
  #gate input:focus{border-color:var(--accent)}
  #gate button{width:100%;margin-top:11px;padding:10px;border-radius:9px;border:0;background:var(--accent);color:#08111c;font-size:14px;font-weight:650;cursor:pointer}
  #gate button:disabled{opacity:.55;cursor:default}
  #gmsg{margin-top:11px;font-size:12.5px;color:var(--bad);min-height:17px}
  @media(max-width:560px){.wrap{padding:20px 14px 44px}h1{font-size:18px}.big b{font-size:25px}}
</style>
</head>
<body>
<div id="gate" hidden>
  <h2>需要密码</h2>
  <p>看板数据已加密，输入密码查看。</p>
  <input id="gpw" type="password" autocomplete="current-password" placeholder="密码">
  <button id="gbtn">解锁</button>
  <div id="gmsg"></div>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div>
      <h1>静态 ISP 节点到期看板</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div id="status"></div>
  </header>
  <div id="err"></div>
  <div class="kpis" id="kpis"></div>
  <h2>节点明细</h2>
  <div class="grid" id="nodes"></div>
  <h2>推送记录</h2>
  <div class="panel" id="alerts"></div>
  <footer>
    <span id="foot"></span>
    <span><a id="manage" target="_blank" rel="noopener noreferrer">前往管理后台 →</a></span>
  </footer>
</div>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(D){
  const TH = D.threshold;
  const level = (d) => d < 0 ? "bad" : d <= TH ? "warn" : "ok";

  $("sub").textContent =
    `巡检时间 ${D.checkedAt || "—"}　·　阈值 剩余 ≤ ${TH} 天　·　生成于 ${D.generatedAt}（Asia/Shanghai）`;

  $("status").innerHTML = D.ok
    ? `<span class="pill ok"><i class="dot"></i>巡检正常</span>`
    : `<span class="pill bad"><i class="dot"></i>巡检失败</span>`;

  if (!D.ok && D.error) {
    $("err").innerHTML = `<div class="err"><b>最近一次巡检未成功</b><br>下面显示的是此前最后一次成功巡检的数据，仅供参考。<br><code>${esc(D.error)}</code></div>`;
  }

  const kpis = [
    { k: "账号节点总数", v: D.total, cls: "" },
    { k: `临期（≤${TH} 天）`, v: D.expiring, cls: D.expiring ? "warn" : "ok" },
    { k: "已过期", v: D.overdue, cls: D.overdue ? "bad" : "" },
    { k: "今日推送", v: D.pushedToday ? "已发送" : "未发送", cls: D.pushedToday ? "ok" : "" },
  ];
  $("kpis").innerHTML = kpis.map(x =>
    `<div class="kpi ${x.cls}"><div class="v">${x.v}</div><div class="k">${x.k}</div></div>`).join("");

  // 迷你趋势线：虚线是阈值，实线是剩余天数
  const SW = 100, SH = 30;
  function spark(trend){
    if (!trend || trend.length < 2) return "";
    const vals = trend.map(t => t.days);
    const max = Math.max(...vals, TH), min = Math.min(...vals, 0);
    const span = Math.max(max - min, 1);
    const pts = trend.map((t, i) => {
      const x = (i / (trend.length - 1)) * SW;
      const y = SH - ((t.days - min) / span) * (SH - 4) - 2;
      return [x, y];
    });
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = d + ` L${SW} ${SH} L0 ${SH} Z`;
    const thY = SH - ((TH - min) / span) * (SH - 4) - 2;
    const last = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 ${SW} ${SH}" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" y1="${thY.toFixed(1)}" x2="${SW}" y2="${thY.toFixed(1)}" stroke="#f0a020" stroke-width="0.7" stroke-dasharray="2 2" opacity=".55"/>
      <path d="${area}" fill="#4a9eff" opacity=".10"/>
      <path d="${d}" fill="none" stroke="#4a9eff" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="1.9" fill="#4a9eff"/>
    </svg>`;
  }

  if (!D.nodes.length) {
    $("nodes").innerHTML = `<div class="empty">还没有巡检记录。等下一次定时巡检后这里会自动填充。</div>`;
  } else {
    $("nodes").innerHTML = D.nodes.map(n => {
      const lv = level(n.daysLeft);
      const pct = Math.max(0, Math.min(100, (n.daysLeft / 30) * 100));
      return `<div class="card ${lv}">
        <div class="ip">${esc(n.ip)}</div>
        <div class="meta">${esc(n.region || "—")}${n.mark ? `<span class="tag">${esc(n.mark)}</span>` : ""}</div>
        <div class="big"><b>${n.daysLeft < 0 ? "!" : n.daysLeft.toFixed(1)}</b><span>${n.daysLeft < 0 ? "天（已过期）" : "天后到期"}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        ${spark(n.trend)}
        <div class="rows">
          <div><span>到期时间</span><span class="nowrap">${esc(n.expired || "—")}</span></div>
          <div><span>状态</span><span>${esc(n.status)}</span></div>
          <div><span>已提醒</span><span>${n.alertCount ? `第 ${n.alertCount} 次` : "—"}</span></div>
          ${n.firstAlertAt ? `<div><span>首次提醒</span><span class="nowrap">${esc(n.firstAlertAt)}</span></div>` : ""}
        </div>
      </div>`;
    }).join("");
  }

  if (!D.alerts.length) {
    $("alerts").innerHTML = `<div class="empty">暂无推送记录。</div>`;
  } else {
    $("alerts").innerHTML = `<table><thead><tr>
        <th>时间</th><th>结果</th><th>涉及节点</th></tr></thead><tbody>
        ${D.alerts.map(a => `<tr>
          <td class="mono nowrap">${esc(a.date)}</td>
          <td>${esc(a.push)}</td>
          <td class="mono">${a.ips.map(esc).join("<br>")}</td>
        </tr>`).join("")}
        </tbody></table>`;
  }

  $("foot").textContent =
    `共 ${D.total} 个节点 · 历史 ${D.historyDays} 条快照 · 提醒策略：剩余 ≤ ${TH} 天每天推送一次，续费后自动停止`;
  $("manage").href = D.targetUrl;

  $("app").hidden = false;
}

const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(enc, password){
  const enc2 = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc2.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
    base,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}

async function unlock(){
  const pw = $("gpw").value;
  if (!pw) return;
  const btn = $("gbtn");
  btn.disabled = true;
  $("gmsg").textContent = "解密中…";
  try {
    const data = await decrypt(PAYLOAD.enc, pw);
    $("gate").hidden = true;
    render(data);
  } catch (e) {
    $("gmsg").textContent = "密码不正确";
    btn.disabled = false;
  }
}

if (PAYLOAD.plain) {
  render(PAYLOAD.plain);
} else if (PAYLOAD.enc) {
  $("gate").hidden = false;
  $("gbtn").addEventListener("click", unlock);
  $("gpw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
  $("gpw").focus();
} else {
  $("gate").hidden = false;
  $("gmsg").textContent = "页面数据缺失，请重新构建看板。";
}
</script>
